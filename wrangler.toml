name = "edgetunnel"
main = "_worker.js"
compatibility_date = "2026-09-19"
workers_dev = true
preview_urls = true

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

[[kv_namespaces]]
binding = "KV"
id = "13a367b3c8354becb463a9e34f959070"

[vars]
ADMIN = "daodaocrazy"

[[routes]]
pattern = "edgetunnel.daodaocrazy.qzz.io/*"
zone_name = "daodaocrazy.qzz.io"