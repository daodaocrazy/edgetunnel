name: Upstream Sync

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Sync upstream changes
        id: sync
        run: |
          git config user.name "GH Action - Upstream Sync"
          git config user.email "action@github.com"

          git remote add upstream https://github.com/cmliu/edgetunnel.git
          git fetch upstream main

          UPSTREAM=$(git rev-parse upstream/main)
          LOCAL_DEPLOY_FILES=".github/workflows/deploy.yml .github/workflows/sync.yml wrangler.toml package.json package-lock.json"

          git checkout upstream/main -- _worker.js
          python3 - <<'PY'
          from pathlib import Path
          path = Path("_worker.js")
          data = path.read_bytes()
          if data.startswith(b"\xef\xbb\xbf"):
              path.write_bytes(data[3:])
          PY
          if git diff --quiet -- _worker.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Upstream _worker.js unchanged."
            exit 0
          fi

          git add _worker.js
          git commit -m "chore: sync upstream _worker.js (${UPSTREAM:0:7})"
          git push origin main
          echo "changed=true" >> "$GITHUB_OUTPUT"
