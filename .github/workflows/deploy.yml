name: Deploy edgetunnel Worker

on:
  workflow_dispatch:

concurrency:
  group: deploy-edgetunnel-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install --no-save wrangler@4

      - name: Generate Wrangler config
        env:
          EDGETUNNEL_ADMIN: ${{ secrets.EDGETUNNEL_ADMIN }}
          EDGETUNNEL_UUID: ${{ secrets.EDGETUNNEL_UUID }}
        run: |
          cp wrangler.toml wrangler.generated.toml
          printf '\n[vars]\nADMIN = "%s"\nUUID = "%s"\n' "$EDGETUNNEL_ADMIN" "$EDGETUNNEL_UUID" >> wrangler.generated.toml

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN_GMAIL }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_GMAIL }}
          command: deploy --config wrangler.generated.toml
